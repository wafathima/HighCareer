
services:
  postgres:
    image: postgres:18
    container_name: highcareer-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: highcareer
      POSTGRES_PASSWORD: highcareer_dev_password
      POSTGRES_DB: highcareer

    ports:
    - "127.0.0.1:5433:5432"

    volumes:
      - highcareer_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highcareer -d highcareer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  highcareer_postgres_data:
